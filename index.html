<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Battle City — Танчики</title>
<meta name="description" content="Классические танчики: пиксельная графика, защита орла, 20 врагов на этапе. Играйте с клавиатуры или на iPad.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="game" aria-label="Танчики Battle City">
  <div class="display">
    <canvas id="game" width="256" height="240" tabindex="0" aria-label="Battle City. Enter — начать игру, WASD или стрелки — движение, пробел — огонь, P — пауза."></canvas>
    <button id="canvas-action" class="canvas-action" aria-label="Начать игру"></button>
  </div>
  <div class="touch-controls" aria-label="Управление игрой">
    <div class="dpad" aria-label="Движение">
      <button class="pad up" data-key="up" aria-label="Вверх">▲</button>
      <button class="pad left" data-key="left" aria-label="Влево">◀</button>
      <span class="pad-center" aria-hidden="true"></span>
      <button class="pad right" data-key="right" aria-label="Вправо">▶</button>
      <button class="pad down" data-key="down" aria-label="Вниз">▼</button>
    </div>
    <div class="touch-actions"><button class="fire" data-key="fire" aria-label="Огонь">B</button><button class="fire second" data-key="fire" aria-label="Огонь">A</button></div>
  </div>
  <nav class="toolbar" aria-label="Настройки игры">
    <button id="start">START</button><button id="pause">PAUSE</button><button id="sound" aria-pressed="true">SOUND ON</button><button id="fullscreen" aria-label="На весь экран">⛶</button>
  </nav>
  <p class="help">1P: WASD / стрелки · ПРОБЕЛ — огонь · P — пауза<br>2P: стрелки + ENTER · Редактор: нажми на поле, B — блок, START — играть</p>
  <p id="status" class="sr-only" aria-live="polite">Выберите режим и нажмите START.</p>
</main>
<script src="levels.js"></script>
<script src="game.js"></script>
</body>
</html>
