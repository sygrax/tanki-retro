function update(dt){player.cd-=dt;player.shield-=dt;let d=keys.has('ArrowUp')||keys.has('KeyW')?0:keys.has('ArrowRight')||keys.has('KeyD')?1:keys.has('ArrowDown')||keys.has('KeyS')?2:keys.has('ArrowLeft')||keys.has('KeyA')?3:-1;if(d>=0)move(player,d,dt);if(keys.has('Space'))shoot(player);spawn-=dt;if(spawn<=0&&remaining>0&&enemies.length<4){let positions=[3,12,23],x=positions[Math.floor(Math.random()*3)]*S+3;if(![player,...enemies].some(t=>Math.abs(t.x-x)<24&&t.y<35)){enemies.push(tank(x,3,2,true));remaining--;hud()}spawn=1.7}
for(const t of enemies){t.cd-=dt;t.turn-=dt;if(t.turn<=0){t.d=Math.random()<.55?2:Math.floor(Math.random()*4);t.turn=.5+Math.random()*1.4}if(!move(t,t.d,dt)){t.turn=0}shoot(t)}
for(const b of bullets){const v=dirs[b.d];b.x+=v[0]*290*dt;b.y+=v[1]*290*dt;if(b.x<0||b.y<0||b.x>=624||b.y>=624){b.dead=true;continue}let x=Math.floor(b.x/S),y=Math.floor(b.y/S),tile=map[y]?.[x];if(tile===1||tile===2){if(tile===1){map[y][x]=0;burst(b.x,b.y)}b.dead=true;continue}if(b.y>=24*S&&b.x>=12*S&&b.x<14*S){burst(312,600);b.dead=true;end();break}if(b.enemy){if(b.x>player.x&&b.x<player.x+18&&b.y>player.y&&b.y<player.y+18){b.dead=true;hitPlayer()}}else{for(const t of enemies){if(b.x>t.x&&b.x<t.x+18&&b.y>t.y&&b.y<t.y+18){t.dead=true;b.dead=true;burst(t.x+9,t.y+9);score+=100;killed++;hud();break}}}}
bullets=bullets.filter(b=>!b.dead);enemies=enemies.filter(t=>!t.dead);hud();if(!remaining&&!enemies.length&&state==='play')end(true)}
const sprite=[
'0000001100000000','0000001100000000','0220001100022000','0212001100212000','0212111111212000','0222113311222000','0212133331212000','0212131131212000','0222131131222000','0212133331212000','0212111111212000','0222111111222000','0212001100212000','0212000000212000','0222000000222000','0000000000000000'];
const eagle=['1000000000000001','1100000000000011','1110000110000111','1111001111001111','0111101111011110','0011111111111100','0001111111111000','0011111111111100','0110011111100110','1000111111110001','0001111111111000','0011101111011100','0110001111000110','0000001111000000','0000011111100000','0000110000110000'];
function pixels(pattern,x,y,scale,colors){for(let r=0;r<pattern.length;r++)for(let q=0;q<pattern[r].length;q++){const n=+pattern[r][q];if(n){g.fillStyle=colors[n-1];g.fillRect(x+q*scale,y+r*scale,scale,scale)}}}
function drawTank(t){g.save();g.translate(Math.round(t.x+9),Math.round(t.y+9));g.rotate(t.d*Math.PI/2);pixels(sprite,-12,-12,1.5,t.enemy?['#fcfcfc','#7c7c7c','#bcbcbc']:['#f8b800','#a85000','#fce0a8']);g.restore();if(t.shield>0&&Math.floor(t.shield*10)%2){g.strokeStyle='#fcfcfc';g.lineWidth=2;g.strokeRect(t.x-6,t.y-6,30,30)}}
function draw(){g.fillStyle='#000';g.fillRect(0,0,624,624);for(let y=0;y<N;y++)for(let x=0;x<N;x++){let t=map[y][x],px=x*S,py=y*S;if(t===1){g.fillStyle='#a45018';g.fillRect(px,py,24,24);g.fillStyle='#000';g.fillRect(px,py+10.5,24,1.5);g.fillRect(px,py+22.5,24,1.5);g.fillRect(px+10.5,py,1.5,12);g.fillRect(px+22.5,py+12,1.5,12);g.fillStyle='#fcbcb0';g.fillRect(px,py,10.5,1.5);g.fillRect(px+12,py,12,1.5);g.fillRect(px,py+12,22.5,1.5);g.fillRect(px,py,1.5,10.5);g.fillRect(px+12,py,1.5,10.5);g.fillRect(px,py+12,1.5,10.5)}if(t===2){g.fillStyle='#7c7c7c';g.fillRect(px,py,24,24);g.fillStyle='#fcfcfc';g.fillRect(px,py,24,3);g.fillRect(px,py,3,24);g.fillStyle='#bcbcbc';g.fillRect(px+6,py+6,15,15)}}pixels(eagle,288,576,3,['#bcbcbc']);drawTank(player);enemies.forEach(drawTank);for(const b of bullets){g.fillStyle='#fcfcfc';g.fillRect(Math.round(b.x)-3,Math.round(b.y)-3,6,6)}for(const p of sparks){g.fillStyle=p.t>.25?'#fcfcfc':p.t>.13?'#f8b800':'#d82800';g.fillRect(Math.round(p.x/3)*3,Math.round(p.y/3)*3,6,6)}}
function loop(t){let dt=Math.min((t-last)/1000,.025);last=t;if(state==='play')update(dt);for(const p of sparks){p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt}sparks=sparks.filter(p=>p.t>0);draw();requestAnimationFrame(loop)}
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyW','KeyA','KeyS','KeyD','KeyP','Enter'].includes(e.code)){if(e.target.tagName!=='BUTTON')e.preventDefault();keys.add(e.code)}if(e.repeat)return;if(e.code==='KeyP')togglePause();if(e.code==='Enter'&&state!=='play')start()});window.addEventListener('keyup',e=>keys.delete(e.code));window.addEventListener('blur',()=>{keys.clear();if(state==='play')togglePause()});$('start').onclick=start;$('pause').onclick=togglePause;$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'♪ ЗВУК ВКЛ.':'♪ ЗВУК ВЫКЛ.';if(sound)beep()};document.querySelectorAll('[data-key]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(b.dataset.key)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys.delete(b.dataset.key))});initMap();requestAnimationFrame(loop);
